<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Means - Pemetaan Zona Banjir Bolaang Mongondow Utara</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
    />
    <!-- Google Fonts - Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="{{url_for('static',filename='vendor/leaflet/leaflet.css')}}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #6610f2;
        --secondary-color: #7c3aed;
        --accent-color: #a855f7;
        --light-purple: #f3f4f6;
        --dark-text: #1f2937;
        --light-text: #6b7280;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", sans-serif;
        line-height: 1.6;
        color: var(--dark-text);
        overflow-x: hidden;
      }

      /* Navbar Styles */
      .navbar {
        background: rgba(102, 16, 242, 0.95) !important;
        backdrop-filter: blur(20px);
        box-shadow: 0 4px 30px rgba(102, 16, 242, 0.1);
        transition: all 0.3s ease;
      }

      .navbar-brand {
        font-weight: 700;
        font-size: 1.5rem;
        color: white !important;
      }

      .navbar-nav .nav-link {
        color: rgba(255, 255, 255, 0.9) !important;
        font-weight: 500;
        margin: 0 10px;
        transition: all 0.3s ease;
        position: relative;
      }

      .navbar-nav .nav-link:hover {
        color: white !important;
        transform: translateY(-2px);
      }

      .navbar-nav .nav-link::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 50%;
        width: 0;
        height: 2px;
        background: white;
        transition: all 0.3s ease;
        transform: translateX(-50%);
      }

      .navbar-nav .nav-link:hover::after {
        width: 80%;
      }

      /* Hero Section */
      .hero-section {
        background: linear-gradient(
          135deg,
          var(--primary-color) 0%,
          var(--secondary-color) 50%,
          var(--accent-color) 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .hero-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><radialGradient id="a" cx="50%" cy="50%"><stop offset="0%" stop-color="%23ffffff" stop-opacity="0.1"/><stop offset="100%" stop-color="%23ffffff" stop-opacity="0"/></radialGradient></defs><circle cx="200" cy="200" r="100" fill="url(%23a)"/><circle cx="800" cy="300" r="150" fill="url(%23a)"/><circle cx="400" cy="700" r="120" fill="url(%23a)"/></svg>');
        animation: float 20s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
        }
      }

      .hero-content {
        position: relative;
        z-index: 2;
      }

      .hero-title {
        font-size: 4rem;
        font-weight: 800;
        color: white;
        margin-bottom: 1.5rem;
        line-height: 1.2;
      }

      .hero-subtitle {
        font-size: 1.4rem;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 2.5rem;
        font-weight: 400;
      }

      .btn-hero {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 15px 35px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 50px;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        margin-right: 15px;
        margin-bottom: 15px;
        display: inline-block;
      }

      .btn-hero:hover {
        background: white;
        color: var(--primary-color);
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .hero-image {
        position: relative;
        z-index: 2;
      }

      .floating-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 20px;
        margin: 20px 0;
        animation: floatCard 6s ease-in-out infinite;
      }

      @keyframes floatCard {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      /* Statistics Section */
      .stats-section {
        padding: 100px 0;
        background: linear-gradient(45deg, #f8fafc 0%, #f1f5f9 100%);
        position: relative;
      }

      .stat-card {
        background: white;
        border-radius: 20px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(102, 16, 242, 0.1);
        transition: all 0.3s ease;
        border: 1px solid rgba(102, 16, 242, 0.05);
        position: relative;
        overflow: hidden;
      }

      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--primary-color),
          var(--accent-color)
        );
      }

      .stat-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 30px 80px rgba(102, 16, 242, 0.15);
      }

      .stat-icon {
        font-size: 3rem;
        color: var(--primary-color);
        margin-bottom: 20px;
      }

      .stat-number {
        font-size: 3rem;
        font-weight: 800;
        color: var(--primary-color);
        margin-bottom: 10px;
      }

      .stat-label {
        font-size: 1.1rem;
        color: var(--light-text);
        font-weight: 500;
      }

      /* Map Section */

      .section-title {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--dark-text);
        margin-bottom: 20px;
        text-align: center;
      }

      .section-subtitle {
        font-size: 1.2rem;
        color: var(--light-text);
        text-align: center;
        margin-bottom: 60px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      /* Shadcn Form Select override */
      .form-select {
        border-radius: 0.5rem;
        font-size: 0.875rem;
        border: 1px solid #e2e8f0;
        box-shadow: none !important;
        transition: all 0.2s ease;
      }

      .form-select:focus {
        border-color: #0f172a;
      }

      .z-3 {
        z-index: 1030;
      }

      /* Menghilangkan scrollbar pada body saat di section map */
      .vh-100 {
        height: 100vh !important;
      }

      /* Memastikan Map Leaflet mengisi kontainer */
      #map {
        z-index: 1;
        outline: none;
      }

      /* Floating Card Glassmorphism */
      .backdrop-blur-md {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      /* Features Section */
      .features-section {
        padding: 100px 0;
        background: linear-gradient(135deg, #6610f2 0%, #7c3aed 100%);
      }

      .feature-card {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        backdrop-filter: blur(20px);
        transition: all 0.3s ease;
        height: 100%;
      }

      .feature-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.15);
      }

      .feature-icon {
        font-size: 3rem;
        color: white;
        margin-bottom: 25px;
      }

      .feature-title {
        font-size: 1.4rem;
        font-weight: 600;
        color: white;
        margin-bottom: 15px;
      }

      .feature-text {
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.7;
      }

      /* Footer */
      .footer {
        background: #1a1a2e;
        color: white;
        padding: 50px 0 30px;
      }
      .modal-body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        padding: 24px;
        color: white;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        margin: 0 auto;
      }
      .footer-title {
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: white;
      }

      .footer-link {
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        transition: all 0.3s ease;
        display: block;
        margin-bottom: 8px;
      }

      .footer-link:hover {
        color: var(--accent-color);
        transform: translateX(5px);
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .hero-title {
          font-size: 2.5rem;
        }

        .hero-subtitle {
          font-size: 1.1rem;
        }

        .stat-card {
          margin-bottom: 30px;
        }
      }

      /* Loading Animation */
      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .whatsapp-float {
        position: fixed;
        width: 60px;
        height: 60px;
        bottom: 20px;
        right: 20px;
        background-color: #25d366;
        color: #fff;
        border-radius: 50%;
        text-align: center;
        font-size: 28px;
        box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .whatsapp-float:hover {
        background-color: #20b358;
        transform: scale(1.1);
      }

      .whatsapp-float i {
        line-height: 1;
      }
    </style>
  </head>

  <body>
    <section
      class="map-section position-relative vh-100 overflow-hidden"
      style="margin-top: -1rem"
    >
      <div
        class="container-fluid position-absolute top-0 start-50 translate-middle-x z-3 mt-4 px-4"
        style="max-width: 900px"
      >
        <div
          class="position-absolute top-0 start-50 translate-middle-x z-3 mt-4 px-3 w-100"
          style="max-width: 800px"
        >
          <div
            class="s-card bg-white border border-slate-200 p-4 rounded-3 shadow-sm"
          >
            <div class="row g-3 align-items-end">
              <div class="col-12 col-md-6">
                <label
                  for="kecamatan"
                  class="form-label small fw-bold text-dark mb-2"
                >
                  <i class="fas fa-map-marker-alt me-1 text-muted"></i> Lokasi
                  Wilayah
                </label>
                <select class="form-select custom-select-shadcn" id="kecamatan">
                  <option value="">Pilih Kecamatan</option>
                  <option value="all">Semua Wilayah</option>
                </select>
              </div>

              <div class="col-12 col-md-6">
                <label
                  for="filterCluster"
                  class="form-label small fw-bold text-dark mb-2"
                >
                  <i class="fas fa-shield-alt me-1 text-muted"></i> Status
                  Kerawanan
                </label>
                <select
                  class="form-select custom-select-shadcn"
                  id="filterCluster"
                >
                  <option value="all">Semua Status</option>
                  <option value="Sangat Rawan">Sangat Rawan</option>
                  <option value="Rawan">Rawan</option>
                  <option value="Tidak Rawan">Tidak Rawan</option>
                </select>
              </div>             
            </div>
          </div>
        </div>
      </div>

      <div id="map" class="w-100 h-100 bg-light"></div>
          <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog  rounded-2xl">
              <div class="modal-body" id="modalContent">
                <!-- Isi dari JavaScript -->
              </div>
            </div>
          </div>
    </div>
    </section>
    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <!-- <script src="{{url_for('static',filename='/vendor/leaflet/leaflet.js')}}"></script> -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
      integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      const map = L.map("map", {
        center: [0.7609332, 123.2606188],
        zoom: 12,
      });
      L.tileLayer(
        "https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}",
        {
          attribution: "Maps",
          id: "mapbox/outdoors-v11",
          accessToken:
            "pk.eyJ1Ijoia2lraWlzYSIsImEiOiJjbWE2N2kyaWowajVhMmpzZnhjbTFzdGJsIn0.7CJ3vKEqNj3XxC6MstaehA",
        }
      ).addTo(map);
      // Animasi
      map.whenReady(() => {
        map.flyTo([0.7609332, 123.2606188], 12, {
          animate: true,
          duration: 2,
        });
      });

      // ================== STATE ==================
      const filterCluster = document.getElementById("filterCluster");
      const selectRegency = document.getElementById("kecamatan");

      let previousLayers = [];
      let legendAdded = false;
      let globalData = []; // cache data

      // ================== UTIL ==================
      const clearMapLayers = () => {
        previousLayers.forEach((layer) => map.removeLayer(layer));
        previousLayers = [];
      };

      // ================== FETCH DATA ==================
      const loadData = async () => {
        const res = await fetch("/api/results");
        globalData = await res.json();
      };

      // ================== DROPDOWN ==================
      const fetchSelectDown = async () => {
        try {
          const res = await fetch(
            "https://www.emsifa.com/api-wilayah-indonesia/api/districts/7107.json"
          );
          const districts = await res.json();

          districts.forEach((d) => {
            const option = document.createElement("option");
            option.value = d.id;
            option.textContent = d.name;
            selectRegency.appendChild(option);
          });
        } catch (err) {
          console.error("Gagal ambil kecamatan:", err);
        }
      };

      // ================== FILTER CORE ==================
      const applyFilter = (id_kecamatan) => {
        let hasil = [...globalData];

        // Filter kecamatan
        if (id_kecamatan !== "all") {
          hasil = hasil.filter((item) => item.kecamatan == id_kecamatan);
        }

        // ✅ Filter cluster
        const selectedCluster = filterCluster.value;
        if (selectedCluster !== "all") {
          hasil = hasil.filter((item) => item.claster === selectedCluster);
        }

        return hasil;
      };

      // ================== RENDER MAP ==================
      const renderMap = async (data) => {
        for (const values of data) {
          const geojsonUrl = `/static/upload/${values.geojson}`;

          let circleColor = "#999";
          let iconUrl = "/static/image/default.png";

          if (values.claster === "Sangat Rawan") {
            circleColor = "#DC3545";
            iconUrl = "https://cdn-icons-png.flaticon.com/128/564/564619.png";
          } else if (values.claster === "Rawan") {
            circleColor = "#ffc107";
            iconUrl = "https://cdn-icons-png.flaticon.com/128/1008/1008928.png";
          } else if (values.claster === "Tidak Rawan") {
            circleColor = "#347433";
            iconUrl = "https://cdn-icons-png.flaticon.com/128/1161/1161388.png";
          }

          const geojsonData = await (await fetch(geojsonUrl)).json();

          const layer = L.geoJSON(geojsonData, {
            style: {
              color: circleColor,
              weight: 1,
            },
            onEachFeature: (feature, layer) => {
            const props = feature.properties;
              layer.bindTooltip(feature.properties.nama || "Tanpa Nama");

              layer.on("click", () => {
                const content = `<div style="">
    <!-- Header Section -->
    <div style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    ">
      <div style="
       
      ">
        <img src="${iconUrl}" alt="Location Icon" style="
          width: 50px;
          height: 50px;
        
        ">
      </div>
      <h1 style="
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        letter-spacing: 0.5px;
      ">${values.claster}</h1>
    </div>

    <!-- Info Section -->
    <div style="
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    ">
      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">📍</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Nama Lokasi</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${props.nama || "Tidak diketahui"}</p>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">🏘️</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Kecamatan</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${props.kecamatan || "-"}</p>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">🌊</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Riwayat Banjir</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${values.banjir_histori || "-"}</p>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">🌧️</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Curah Hujan</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${values.curah_hujan || "-"}</p>
      </div>

      <div>
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">⛰️</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Kemiringan</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${values.kemiringan || "-"}</p>
      </div>
    </div>
  </div>`;

                document.getElementById("modalContent").innerHTML = content;
                new bootstrap.Modal(
                  document.getElementById("infoModal")
                ).show();
              });
            },
          }).addTo(map);

          previousLayers.push(layer);
        }

        // ================== LEGEND ==================
        if (!legendAdded) {
          const legend = L.control({ position: "bottomright" });
          legend.onAdd = function (map) {
            const div = L.DomUtil.create("div", "info legend");
            const grades = ["Sangat Rawan", "Rawan", "Tidak Rawan"];
            const colors = ["#FF894F", "#ffc107", "#7ADAA5"];
            const labels = [];

            for (let i = 0; i < grades.length; i++) {
              labels.push(
                `<i style="background:${colors[i]}; width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8;"></i> ${grades[i]}<br>`
              );
            }

            div.innerHTML = labels.join("");
            return div;
          };
          legend.addTo(map);
          legendAdded = true;
        }
      };

      // ================== MAIN ==================
      const updateMap = async () => {
        clearMapLayers();
        const kecamatan = selectRegency.value || "all";

        const filtered = applyFilter(kecamatan);
        await renderMap(filtered);
      };

      // ================== EVENT ==================
      selectRegency.addEventListener("change", updateMap);
      filterCluster.addEventListener("change", updateMap);

      // ================== INIT ==================
      (async () => {
        await fetchSelectDown();
        await loadData();
        await updateMap();
      })();
    </script>
  </body>
</html>
