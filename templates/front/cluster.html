    /* Navbar Styles */

      transform: translateY(-2px);

    .navbar-nav .nav-link::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 50%;
      width: 0;
      height: 2px;
      background: white;
      transition: all 0.3s ease;
      transform: translateX(-50%);

    .navbar-nav .nav-link:hover::after {
      width: 80%;

    /* Hero Section */
    .hero-section {
      background: linear-gradient(
        135deg,
        var(--primary-color) 0%,
        var(--secondary-color) 50%,
        var(--accent-color) 100%
      );
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><radialGradient id="a" cx="50%" cy="50%"><stop offset="0%" stop-color="%23ffffff" stop-opacity="0.1"/><stop offset="100%" stop-color="%23ffffff" stop-opacity="0"/></radialGradient></defs><circle cx="200" cy="200" r="100" fill="url(%23a)"/><circle cx="800" cy="300" r="150" fill="url(%23a)"/><circle cx="400" cy="700" r="120" fill="url(%23a)"/></svg>');
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
      }

    .hero-content {
      position: relative;
      z-index: 2;

    .hero-title {

    }

    .hero-subtitle {
      font-size: 1.4rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 2.5rem;
      font-weight: 400;
    }

    .btn-hero {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      transition: all 0.3s ease;

      margin-bottom: 15px;

    .btn-hero:hover {
      background: white;
      color: var(--primary-color);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .hero-image {
      position: relative;
      z-index: 2;
    }

    .floating-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 20px;
      margin: 20px 0;
      animation: floatCard 6s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%,
      100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    /* Statistics Section */
    .stats-section {
      padding: 100px 0;
      background: linear-gradient(45deg, #f8fafc 0%, #f1f5f9 100%);
      position: relative;
    }

    .stat-card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(102, 16, 242, 0.1);
      transition: all 0.3s ease;
      border: 1px solid rgba(102, 16, 242, 0.05);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(
        90deg,
        var(--primary-color),
        var(--accent-color)
      );
    }

    .stat-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 80px rgba(102, 16, 242, 0.15);
    }

    .stat-icon {
      font-size: 3rem;

    }

    .stat-label {
      font-size: 1.1rem;

    }

    /* Map Section */

    .section-title {

      color: var(--dark-text);

    /* Features Section */
    .features-section {

    .feature-card {
      background: rgba(255, 255, 255, 0.1);

    .feature-card:hover {

    .feature-icon {

    .feature-title {

    /* Responsive Design */
    @media (max-width: 768px) {

    /* Loading Animation */
    .loading {

<body>
  <section class="map-section mb-4">
    <div class="container">
      <div class="row justify-content-center mt-4">
        <div class="col-md-6">
          <label for="kecamatan" class="form-label fw-bold">
            <i class="fas fa-globe me-1"></i>Filter Berdasarkan Kecamatan
          </label>
          <select class="form-select" id="kecamatan" required>
            <option value="">Pilih Kecamatan</option>
            <option value="all">Semua Wilayah</option>
          </select>
        
        </div>
      </div>
      <div class="d-flex justify-content-center">
        <div class="card border-0 w-75">
          <div class="card-body">
            <div id="map"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog  rounded-2xl">
      <div class="modal-body" id="modalContent">
        <!-- Isi dari JavaScript -->
      </div>
    </div>
  </div>
  </section>
  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS -->
  <!-- <script src="{{url_for('static',filename='/vendor/leaflet/leaflet.js')}}"></script> -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const map = L.map("map", {
  center: [0.7609332, 123.2606188],
  zoom: 12,
  
});
L.tileLayer(
  "https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}",
  {
    attribution: "Maps",
    id: "mapbox/outdoors-v11",
    accessToken:
      "pk.eyJ1Ijoia2lraWlzYSIsImEiOiJjbWE2N2kyaWowajVhMmpzZnhjbTFzdGJsIn0.7CJ3vKEqNj3XxC6MstaehA"
  }
).addTo(map);

    const shp_geojson = "/static/geojson/shp.geojson";
    const fethGeojsonShp = async () => {
      const response = await fetch(shp_geojson);
      const data = await response.json();
      L.geoJSON(data, {
        style: {
          color: "#0000FF",
          weight: 1,
          fill: false,
          opacity: 1,
          dashArray: "5, 5",

        },
      }).addTo(map);
    };
    fethGeojsonShp();


    // Efek animasi zoom ke level 15 saat map selesai dimuat
    map.whenReady(() => {
      map.flyTo([0.7609332, 123.2606188], 12, {
        animate: true,
        duration: 2 // durasi animasi dalam detik
      });
    });

    const selectRegency = document.querySelector("#kecamatan");
    let previousLayers = []; // Menyimpan layer-layer sebelumnya

    // Fungsi hapus semua layer sebelumnya
    const clearMapLayers = () => {
      previousLayers.forEach((layer) => {
        map.removeLayer(layer);
      });
      previousLayers = [];
    };

    // Fetch dropdown kecamatan
    const fetchSelectDown = async () => {
      fetch(
        "https://www.emsifa.com/api-wilayah-indonesia/api/districts/7107.json"
      )
        .then((response) => response.json())
        .then((districts) => {
          districts.forEach((district) => {
            const option = document.createElement("option");
            option.value = district.id;
            option.textContent = district.name;
            selectRegency.appendChild(option);
          });
        })
        .catch((error) => {
          console.error("Gagal mengambil data kecamatan:", error);
        });
    };
    fetchSelectDown();

    // Event saat dropdown berubah
    selectRegency.addEventListener("change", async function () {
      const selectedValue = this.value;
      clearMapLayers(); // Hapus semua layer sebelumnya

      if (selectedValue == "all") {
        await fetchMap("all")
      } else {
        const geojsnondistrick = `/static/geojson/${selectedValue}.geojson`;
        try {
          const response = await fetch(geojsnondistrick);
          if (!response.ok)
            throw new Error(`HTTP error! Status: ${response.status}`);

          const geojsonData = await response.json();

          const borderLayer = L.geoJSON(geojsonData, {
            style: {
              color: "#9929EA",
              weight: 1,
              fill: false,              
              opacity: 1,
              dashArray: "5, 5",

            },
          }).addTo(map);
          previousLayers.push(borderLayer); // Simpan layer

          await fetchMap(selectedValue); // Render peta berdasarkan clustering
        } catch (error) {
          console.error("Error loading GeoJSON:", error);
        }
      }
    });

    // Statistik
    const statNumber = document.querySelector(".terpantau");
    const statNumberTerpantau1 = document.querySelector(".terpantau-1");
    const statNumberRawanBanjir = document.querySelector(".rawan-banjir");
    const statNumberRawanBanjir1 = document.querySelector(".rawan-banjir-1");
    const statSangatRawan = document.querySelector(".sangat-rawan");

    const countClusters = (data) => {
      const result = {
        total: data.length,
        sangatRawan: 0,
        rawan: 0,
        tidakRawan: 0,
      };
      data.forEach((item) => {
        switch (item.claster) {
          case "Sangat Rawan":
            result.sangatRawan++;
            break;
          case "Rawan":
            result.rawan++;
            break;
          case "Tidak Rawan":
            result.tidakRawan++;
            break;
        }
      });
      return result;
    };

    const fetchDataAndCount = async () => {
      const url = "/api/results";
      const response = await fetch(url);
      const data = await response.json();
      const clusterCounts = countClusters(data);
      statNumber.textContent = clusterCounts.total;
      statNumberTerpantau1.textContent = clusterCounts.total;
      statNumberRawanBanjir.textContent = clusterCounts.rawan;
      statSangatRawan.textContent = clusterCounts.sangatRawan;
      statNumberRawanBanjir1.textContent = clusterCounts.rawan;
    };
    fetchDataAndCount();

    // Fungsi render peta berdasarkan clustering
    const fetchMap = async (id_kecamatan) => {
      const response = await fetch(`/api/results`);
      const data = await response.json();
      let hasil;
      if (id_kecamatan != "all") {
        hasil = data.filter((item) => item.kecamatan == id_kecamatan);
      } else {
        hasil = data
      }
      // Tambahkan tileLayer satu kali jika belum ada
      if (!map._tileLayerAdded) {
        L.tileLayer("https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}", {
          attribution: 'Maps',
          id: 'mapbox/outdoors-v11',

          accessToken: 'pk.eyJ1Ijoia2lraWlzYSIsImEiOiJjbWE2N2kyaWowajVhMmpzZnhjbTFzdGJsIn0.7CJ3vKEqNj3XxC6MstaehA'
        }).addTo(map);
        map._tileLayerAdded = true;
      }
      hasil.map(async (values) => {
        const geojsonUrl = `/static/upload/${values.geojson}`;
        let iconUrl = "",
          circleColor = "";
        if (values.claster === "Sangat Rawan") {
          iconUrl = "https://cdn-icons-png.flaticon.com/128/564/564619.png";
          circleColor = "#DC3545";
        } else if (values.claster === "Rawan") {
          iconUrl = "https://cdn-icons-png.flaticon.com/128/1008/1008928.png";
          circleColor = "#ffc107";
        } else if (values.claster === "Tidak Rawan") {
          iconUrl = "https://cdn-icons-png.flaticon.com/128/1161/1161388.png";
          circleColor = "#347433";
        } else {
          iconUrl = "/static/image/default.png";
          circleColor = "#999";
        }

        const geojsonResponse = await fetch(geojsonUrl);
        const geojsonData = await geojsonResponse.json();
        const clusterLayer = L.geoJSON(geojsonData, {
          style: {
            color: circleColor,
            weight: 1,
            opacity: 100,
          },

          onEachFeature: (feature, layer) => {
            layer.on("click", function () {
              const props = feature.properties;
              const content = `
  <div style="">
    <!-- Header Section -->
    <div style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    ">
      <div style="
       
      ">
        <img src="${iconUrl}" alt="Location Icon" style="
          width: 50px;
          height: 50px;
        
        ">
      </div>
      <h1 style="
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        letter-spacing: 0.5px;
      ">${values.claster}</h1>
    </div>

    <!-- Info Section -->
    <div style="
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    ">
      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">📍</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Nama Lokasi</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${props.nama || "Tidak diketahui"}</p>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">🏘️</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Kecamatan</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${props.kecamatan || "-"}</p>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">🌊</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Riwayat Banjir</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${values.banjir_histori || "-"}</p>
      </div>

      <div style="margin-bottom: 16px;">
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">🌧️</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Curah Hujan</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${values.curah_hujan || "-"}</p>
      </div>

      <div>
        <div style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 6px;
        ">
          <span style="
            font-size: 16px;
            opacity: 0.8;
          ">⛰️</span>
          <strong style="
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
          ">Kemiringan</strong>
        </div>
        <p style="
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          padding-left: 24px;
        ">${values.kemiringan || "-"}</p>
      </div>
    </div>
  </div>`
              // Siapkan konten yang mau ditampilkan

              // Masukkan ke modal
              document.getElementById("modalContent").innerHTML = content;

              // Tampilkan modal (pakai Bootstrap 5)
              const modal = new bootstrap.Modal(
                document.getElementById("infoModal")
              );
              modal.show();
            });

            const nama = feature.properties.nama || "Tanpa Nama";
            layer.bindTooltip(nama);
          },
        }).addTo(map);

        previousLayers.push(clusterLayer); // Simpan layer untuk nanti dihapus
      });

      // Legenda tetap ditambahkan satu kali
      if (!map._legendAdded) {
        const legend = L.control({ position: "bottomright" });

        legend.onAdd = function (map) {
          const div = L.DomUtil.create("div", "info legend");
          const grades = ["Sangat Rawan", "Rawan", "Tidak Rawan"];
          const colors = ["#FF894F", "#ffc107", "#7ADAA5"];
          const labels = [];

          for (let i = 0; i < grades.length; i++) {
            labels.push(
              `<i style="background:${colors[i]}; width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8;"></i> ${grades[i]}<br>`
            );
          }

          div.innerHTML = labels.join("");
          return div;
        };

        legend.addTo(map);
        map._legendAdded = true;
      }
    };
  </script>
</body>

</html>
